[package]
name = "supershell"
version = "0.7.0"
edition = "2024"
description = "SuperFedora Native Shell Engine — Quickshell QML & Rust TUI Control Suite"
license = "Apache-2.0"

[lib]
name = "supershell"
path = "src/lib.rs"

[[bin]]
name = "supersettings"
path = "src/bin/supersettings.rs"

[[bin]]
name = "superlock"
path = "src/bin/superlock.rs"

[dependencies]
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
